name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./build.sh
      - name: Offline DSP checks
        run: dist/CallGuard.app/Contents/MacOS/CallGuard --selftest-dsp
      - name: Zip
        run: cd dist && ditto -c -k --keepParent CallGuard.app CallGuard.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CallGuard
          path: dist/CallGuard.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/CallGuard.zip --generate-notes || gh release upload "${GITHUB_REF_NAME}" dist/CallGuard.zip --clobber
