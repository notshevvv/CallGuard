<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3FD1"/>
      <stop offset="0.55" stop-color="#1C1670"/>
      <stop offset="1" stop-color="#0B0830"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#8FA2FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8FA2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7CF5E6"/>
      <stop offset="0.5" stop-color="#3FA8FF"/>
      <stop offset="1" stop-color="#5B3BFF"/>
    </linearGradient>
    <linearGradient id="shieldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9E6"/>
      <stop offset="1" stop-color="#FFD36B"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="458" cy="552" r="142" fill="white"/>
      <circle cx="524" cy="496" r="122" fill="black"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- tile -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- stars -->
    <g fill="#FFFFFF">
      <circle cx="232" cy="236" r="6" opacity="0.9"/>
      <circle cx="790" cy="214" r="4.5" opacity="0.8"/>
      <circle cx="846" cy="402" r="3.5" opacity="0.6"/>
      <circle cx="186" cy="470" r="3.5" opacity="0.55"/>
      <circle cx="318" cy="168" r="3" opacity="0.5"/>
      <circle cx="700" cy="150" r="3" opacity="0.45"/>
      <path d="M800 300 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9z" opacity="0.85"/>
      <path d="M232 640 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6z" opacity="0.6"/>
    </g>
    <!-- top sheen -->
    <rect x="100" y="100" width="824" height="380" fill="url(#sheen)" opacity="0.35"/>
  </g>

  <!-- shield -->
  <g filter="url(#shadow)">
    <path d="M512 236 C592 280 672 300 752 304 C756 520 700 712 512 828 C324 712 268 520 272 304 C352 300 432 280 512 236 Z"
          fill="url(#shield)"/>
  </g>
  <path d="M512 236 C592 280 672 300 752 304 C756 520 700 712 512 828 C324 712 268 520 272 304 C352 300 432 280 512 236 Z"
        fill="none" stroke="url(#shieldEdge)" stroke-width="10"/>
  <path d="M512 262 C584 302 658 320 728 326 C730 410 718 488 690 556 C620 470 420 380 300 360 C298 348 297 337 297 326 C366 320 440 302 512 262 Z"
        fill="#FFFFFF" opacity="0.13"/>

  <!-- moon glow + crescent -->
  <circle cx="458" cy="552" r="146" fill="#FFE8A3" opacity="0.35" filter="url(#soft)" mask="url(#crescent)"/>
  <rect width="1024" height="1024" fill="url(#moon)" mask="url(#crescent)"/>

  <!-- sound bars (staying loud) -->
  <g fill="#FFFFFF">
    <rect x="590" y="506" width="30" height="88" rx="15" opacity="0.95"/>
    <rect x="638" y="466" width="30" height="168" rx="15"/>
    <rect x="686" y="518" width="30" height="64" rx="15" opacity="0.9"/>
  </g>
</svg>
